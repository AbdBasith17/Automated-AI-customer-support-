[tox]
envlist = py311, lint, coverage
skipsdist = true

[testenv]
deps =
    -r requirements.txt
    pytest
    pytest-asyncio
    httpx
    coverage
setenv =
    # LLM — dummy keys, all LLM calls are mocked in tests
    GROQ_API_KEY       = test-groq-key
    GOOGLE_API_KEY     = test-google-key

    # ChromaDB — mocked in tests
    CHROMA_HOST = localhost
    CHROMA_PORT = 8000

    # Redis — mocked in tests
    REDIS_URL = redis://localhost:6379/0

    # Kafka — mocked in tests
    KAFKA_BOOTSTRAP = localhost:9092

    # MongoDB — mocked in tests
    MONGO_URI = mongodb://localhost:27017/test_aion

    # AWS / DynamoDB — mocked in tests
    AWS_ACCESS_KEY_ID       = test
    AWS_SECRET_ACCESS_KEY   = test
    AWS_STORAGE_BUCKET_NAME = test-bucket
    AWS_REGION              = ap-south-1
    DYNAMODB_MESSAGES_TABLE = TestChatMessages
    DYNAMODB_TICKETS_TABLE  = TestTickets

    # n8n
    N8N_WEBHOOK_URL = http://localhost:5678/webhook/test

    # Internal API key
    INTERNAL_API_KEY = test-internal-key

commands =
    pytest {posargs}

[testenv:lint]
deps =
    black
    flake8
    isort
commands =
    isort --profile black --line-length 88 .
    black --line-length 88 .
    flake8 --exclude=.tox,venv .

[testenv:coverage]
deps =
    {[testenv]deps}
commands =
    coverage run -m pytest
    coverage report -m
    coverage html -d htmlcov

[flake8]
max-line-length = 88
extend-ignore   = E203
exclude         = .git,__pycache__,old,build,dist