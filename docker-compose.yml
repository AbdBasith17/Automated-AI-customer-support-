version: '3.8'

services:
  
  nginx:
    image: nginx:alpine
    container_name: aion-gateway
    restart: always
    ports:
      - "8080:80"  
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - ai-service
    networks:
      - aion-network

  backend:
    build: ./django-backend
    container_name: aion-backend
    restart: always
    volumes:
      - ./django-backend:/app
    env_file: ./django-backend/.env
    
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    networks:
      - aion-network

  ai-service:
    build: ./ai-service-fastapi
    ports:
    - "8001:8001"
    container_name: aion-ai-service
    restart: always
    volumes:
      - ./ai-service-fastapi:/app
    env_file: ./ai-service-fastapi/.env
    environment:
      - REDIS_URL=redis://redis:6379/0  # <--- ADD THIS LINE HERE
      - CHROMA_HOST=chroma-db
      - CHROMA_PORT=8000
    depends_on:
      - redis
      - chroma-db
    networks:
      - aion-network

  chroma-db:
    image: chromadb/chroma:latest
    container_name: aion-vector-db
    restart: always
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    
    expose:
      - "8000"
    
    ports:
      - "8000:8000"
    networks:
      - aion-network

  db:
    image: postgres:15-alpine
    container_name: aion-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=enterprise_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    networks:
      - aion-network

  redis:
    image: redis:7-alpine
    container_name: aion-redis
    ports:
      - "6379:6379"
    networks:
      - aion-network

  celery-worker:
    build: ./django-backend
    container_name: aion-celery-worker
    command: celery -A workers.celery_app worker -Q embedding,beat_tasks --loglevel=info -P solo
    volumes:
      - ./django-backend:/app
    env_file: ./django-backend/.env
    depends_on:
      - db
      - redis
    networks:
      - aion-network

  celery-beat:
    build: ./django-backend
    container_name: aion-celery-beat
    command: celery -A workers.celery_app beat --loglevel=info
    volumes:
      - ./django-backend:/app
    env_file: ./django-backend/.env
    depends_on:
      - redis
    networks:
      - aion-network

  flower:
    image: mher/flower
    container_name: aion-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - aion-network

  ai-worker:
    build: ./ai-service-fastapi
    container_name: aion-ai-worker
    command: celery -A celery_app worker --loglevel=info -P solo -Q rag  
    volumes:
      - ./ai-service-fastapi:/app
    env_file: ./ai-service-fastapi/.env
    environment:
      - REDIS_URL=redis://redis:6379/0   
      - CHROMA_HOST=chroma-db
      - CHROMA_PORT=8000
    depends_on:
      - redis
      - chroma-db
    networks:
      - aion-network   

networks:
  aion-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data: