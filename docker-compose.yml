services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=enterprise_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password

  backend:
    build: ./django-backend
    volumes:
      - ./django-backend:/app
    env_file:
      - ./django-backend/.env
    ports:
      - "9001:8000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/enterprise_db
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: