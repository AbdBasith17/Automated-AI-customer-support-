upstream django_backend {
    server backend:8000;
}

upstream fast_ai_service {
    server ai-service:8001;
}

upstream vite_frontend {
    server host.docker.internal:5173;
}

server {
    listen 80;
    server_name localhost;

    # 1. WebSockets (Django Channels) - HIGHEST PRIORITY
    # Fixed to match the /api/ws/ path seen in your logs
    location /api/ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSockets need long timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Django API (Auth, Documents, Chat, and Admin)
    # Added /api/chat to ensure your REST calls reach the backend
    location ~ ^/(api/auth|api/documents|api/chat|admin) {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. FastAPI AI Service
    location /api/ai/ {
        proxy_pass http://fast_ai_service/; 
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
    }

    # 4. Frontend (Vite)
    location / {
        proxy_pass http://vite_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Necessary if you use Vite's HMR (Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}