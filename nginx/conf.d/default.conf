    upstream django_backend {
        server backend:8000;
    }

    upstream fast_ai_service {
        server ai-service:8001;
    }

    upstream vite_frontend {
        server host.docker.internal:5173;
    }

    server {
    listen 80;
    server_name localhost;

    # 1. WEBSOCKETS (The /api/ws/ path must match your frontend exactly)
    location /api/ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass cookies for the WebSocket handshake
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
    }

    # 2. DJANGO API (Catch-all for all backend endpoints)
    # This handles /api/auth/, /api/chat/sessions/, /api/tickets/, etc.
    location ~ ^/(api/auth|api/documents|api/chat|admin) {
        proxy_pass http://django_backend;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure Cookies are passed (Required for JWT in cookies)
        proxy_set_header Cookie $http_cookie;
        
        # DO NOT add 'Access-Control-Allow-Credentials' here. 
        # Django's cors-headers library will add it.
    }

    # 3. ADMIN PANEL
    location /admin {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }

        # 3. FastAPI AI Service
    location /api/ai/ {
        proxy_pass http://fast_ai_service/; 
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
            
        proxy_read_timeout 300s;
    }

        # 4. Frontend (Vite)
    location / {
        proxy_pass http://vite_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
            
            # Necessary if you use Vite's HMR (Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    }