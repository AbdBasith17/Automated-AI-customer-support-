upstream django_backend {
    server backend:8000;
}

upstream fast_ai_service {
    server ai-service:8001;
}

upstream vite_frontend {
    server host.docker.internal:5173;
}

server {
    listen 80;
    server_name localhost;

    # 1. Django API & Admin
    location ~ ^/(api/auth|api/documents|admin) {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSockets (Django Channels)
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 3. FastAPI AI Service
   
    location /api/ai/ {
        
        proxy_pass http://fast_ai_service/; 
        
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 4. Frontend (Vite)
    location / {
        proxy_pass http://vite_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}