[tox]
envlist = py311, lint, coverage
skipsdist = true

[testenv]
deps =
    -r requirements.txt
    pytest
    pytest-django
    pytest-asyncio
    coverage
setenv =
    # Point to test settings — uses SQLite, in-memory cache, no real services
    DJANGO_SETTINGS_MODULE = core.test_settings

    SECRET_KEY        = dummy-secret-key-for-testing-only-must-be-50-chars-long
    DEBUG             = True
    INTERNAL_API_KEY  = dummy-internal-key
    FRONTEND_URL      = http://localhost:5173
    ALLOWED_HOSTS     = localhost,127.0.0.1

    # Database — ignored by test_settings (uses SQLite) but required for import
    DB_NAME     = test_db
    DB_USER     = test_user
    DB_PASSWORD = test_password
    DB_HOST     = localhost
    DB_PORT     = 5432

    # AWS — dummy values, S3 calls are mocked in tests
    AWS_ACCESS_KEY_ID       = testing
    AWS_SECRET_ACCESS_KEY   = testing
    AWS_STORAGE_BUCKET_NAME = testing-bucket
    AWS_S3_REGION_NAME      = us-east-1
    AI_COLLECTION_NAME      = testing-collection

    # Google
    GOOGLE_CLIENT_ID = testing
    GOOGLE_API_KEY   = testing

    # Email — dummy, backend is locmem in test_settings
    EMAIL_HOST_USER   = test@example.com
    EMAIL_HOST_PASSWORD = testpassword
    DEFAULT_FROM_EMAIL  = test@example.com

    # Redis/Celery — ignored by test_settings (tasks run eagerly)
    CELERY_BROKER_URL    = redis://localhost:6379/0
    CELERY_RESULT_BACKEND = redis://localhost:6379/0
    REDIS_URL            = redis://localhost:6379/0

commands =
    pytest {posargs}

[testenv:lint]
deps =
    black
    flake8
    isort
commands =
    isort --profile black --line-length 88 .
    black --line-length 88 .
    flake8 --exclude=.tox,migrations,venv .

[testenv:coverage]
deps =
    {[testenv]deps}
commands =
    coverage run -m pytest
    coverage report -m
    coverage html -d htmlcov

[flake8]
max-line-length = 88
extend-ignore   = E203
exclude         = .git,__pycache__,docs/source/conf.py,old,build,dist,migrations